apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-sentry
name: sentry MCP server
description: Sentry - Error tracking, performance monitoring
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:sentry
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@sentry/mcp-server@latest"
  env:
    SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    SENTRY_ORG: ${SENTRY_ORG}
platforms:
  - darwin
  - linux
  - win32
network: true
