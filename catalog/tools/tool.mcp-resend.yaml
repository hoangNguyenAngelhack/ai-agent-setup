apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-resend
name: resend MCP server
description: Resend - Email sending
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:resend
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@resend/mcp-server@latest"
  env:
    RESEND_API_KEY: ${RESEND_API_KEY}
platforms:
  - darwin
  - linux
  - win32
network: true
