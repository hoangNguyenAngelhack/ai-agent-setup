apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-vercel
name: vercel MCP server
description: Vercel - Deploy, preview, environment management
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:vercel
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@vercel/mcp@latest"
  env:
    VERCEL_API_TOKEN: ${VERCEL_API_TOKEN}
platforms:
  - darwin
  - linux
  - win32
network: true
