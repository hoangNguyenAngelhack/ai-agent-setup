apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-supabase
name: supabase MCP server
description: Supabase - PostgreSQL database, auth, storage, edge functions
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:supabase
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@supabase/mcp-server-supabase@latest"
    - --supabase-url
    - ${SUPABASE_URL}
    - --supabase-key
    - ${SUPABASE_SERVICE_KEY}
  env:
    SUPABASE_URL: ${SUPABASE_URL}
    SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
platforms:
  - darwin
  - linux
  - win32
network: true
