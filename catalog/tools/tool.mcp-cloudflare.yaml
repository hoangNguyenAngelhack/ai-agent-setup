apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-cloudflare
name: cloudflare MCP server
description: Cloudflare - Workers, KV, R2 storage, DNS
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:cloudflare
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@cloudflare/mcp-server@latest"
  env:
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
platforms:
  - darwin
  - linux
  - win32
network: true
