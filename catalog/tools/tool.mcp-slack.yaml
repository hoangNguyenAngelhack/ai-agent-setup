apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-slack
name: slack MCP server
description: Slack - Team messaging, notifications
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:slack
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-slack"
  env:
    SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
platforms:
  - darwin
  - linux
  - win32
network: true
