apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-linear
name: linear MCP server
description: Linear - Issue tracking, project management
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:linear
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@linear/mcp-server@latest"
  env:
    LINEAR_API_KEY: ${LINEAR_API_KEY}
platforms:
  - darwin
  - linux
  - win32
network: true
