apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-firecrawl
name: firecrawl MCP server
description: Firecrawl - Web scraping, crawling
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:firecrawl
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@firecrawl/mcp-server@latest"
  env:
    FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
platforms:
  - darwin
  - linux
  - win32
network: true
