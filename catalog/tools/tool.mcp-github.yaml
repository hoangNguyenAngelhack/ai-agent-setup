apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-github
name: github MCP server
description: GitHub - Enhanced git operations, PRs, issues, actions
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:github
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-github"
  env:
    GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
platforms:
  - darwin
  - linux
  - win32
network: true
