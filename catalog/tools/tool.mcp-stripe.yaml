apiVersion: catalog.ai-agent-setup/v1
kind: Tool
id: tool.mcp-stripe
name: stripe MCP server
description: Stripe - Payment processing, subscriptions
version: 1.6.1
category: integration-automation
status: experimental
dependencies: []
requiredContext:
  projectSignals: []
  files: []
supportedAdapters:
  claude-code: native
  codex: native
requiredPermissions:
  - mcp:stripe
inputSchema: null
outputSchema: null
validation: null
type: mcp
mcp:
  command: npx
  args:
    - -y
    - "@stripe/mcp-server@latest"
  env:
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
platforms:
  - darwin
  - linux
  - win32
network: true
