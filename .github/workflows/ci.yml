name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Minimum Node version is open question OQ-07 (docs/v2/10); 20 is the lowest the dev
        # tooling (Vitest 4) supports.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # V1 characterization tests read the baseline commit with `git archive` (docs/v2/09 §3.2).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Coverage (thresholds 80% for statements, branches, functions and lines) on one leg: Windows
      # skips shell-dependent tests by design, so its numbers would differ.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      - run: npm run catalog:validate
