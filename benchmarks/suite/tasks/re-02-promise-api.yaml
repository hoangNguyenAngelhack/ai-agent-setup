schema: benchmark-task/v1
id: re-02-promise-api
category: refactoring
domains: [backend]
fixture: fixtures/shop
prompt: |
  readConfig(path, callback) in src/legacy.js only has a callback API. Make it also return a Promise when it is
  called without a callback, resolving to the parsed configuration and rejecting on a read or parse error. The
  callback form must keep working exactly as before.
scope: ["src/legacy.js", "test/**"]
acceptance:
  hiddenTests: { files: hidden/re-02-promise-api, command: "node .benchmark-hidden/check.cjs" }
timeLimit: 900
securityChecks:
  - { name: auth-required, command: "node .benchmark-hidden/security/auth-required.cjs" }
  - { name: js-dangerous-calls, command: "node .benchmark-hidden/security/js-dangerous-calls.cjs" }
