<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Sign up</title></head>
  <body>
    <form id="signup">
      <input name="email" placeholder="Email" />
      <input name="password" placeholder="Password" />
      <input name="confirm" placeholder="Confirm password" />
      <div class="errors"></div>
      <div class="submit" onclick="document.getElementById('signup').submit()">Create account</div>
    </form>
  </body>
</html>
